services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: bookmarks-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Force container-internal DNS resolution for the db service.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SERVER_PORT: "8080"
    env_file:
      - .env
    ports:
      - "8080:8080"

volumes:
  db_data: